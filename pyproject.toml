[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-agent-pipeline-v2"
version = "0.3.0"
description = "변경 요구사항 기반 Agentic QA Pipeline V2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.54,<3",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
agent3 = ["pytest>=8,<9", "playwright>=1.45,<2", "psutil>=5.9,<8"]

[project.scripts]
qa-pipeline-v2 = "qa_pipeline_v2:main"
qa-pipeline-ui = "qa_pipeline_ui:main"

[tool.setuptools]
py-modules = [
  "qa_pipeline_v2",
  "qa_pipeline_ui",
  "qa_pipeline_trace",
  "qa_pipeline_io",
  "qa_pipeline_contracts",
  "qa_pipeline_agent1",
  "qa_pipeline_agent2",
  "qa_pipeline_agent3",
  "qa_pipeline_execution",
  "qa_pipeline_reporting",
  "qa_pipeline_orchestrator",
]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
